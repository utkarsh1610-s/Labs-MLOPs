name: Github Lab 2 - Retrain, Evaluate and Calibrate Model

on:
  push:
    branches:
      - main
    paths:
      # only retrain when this lab changes, not on pushes to other labs
      - "Github_Lab2/src/**"
      - "Github_Lab2/requirements.txt"
      - "Github_Lab2/test/**"
      - ".github/workflows/github_lab2_retrain.yml"
  workflow_dispatch:
    inputs:
      calibration_method:
        description: "Calibration method"
        type: choice
        options: [sigmoid, isotonic]
        default: sigmoid

permissions:
  contents: write # needed so the job can push the new model and metrics back

concurrency:
  group: github-lab2-retrain
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Github_Lab2
    env:
      CALIBRATION_METHOD: ${{ inputs.calibration_method || 'sigmoid' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Github_Lab2/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest test -v

      - name: Generate timestamp version
        run: echo "TIMESTAMP=$(date -u '+%Y%m%d%H%M%S')" >> "$GITHUB_ENV"

      - name: Train model
        run: python src/train_model.py --timestamp "$TIMESTAMP"

      - name: Evaluate model
        run: python src/evaluate_model.py --timestamp "$TIMESTAMP"

      - name: Calibrate model
        run: python src/calibrate_model.py --timestamp "$TIMESTAMP" --method "$CALIBRATION_METHOD"

      - name: Add metrics to job summary
        run: |
          {
            echo "### Model version \`$TIMESTAMP\`"
            echo '```json'
            cat "metrics/${TIMESTAMP}_metrics.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push new model version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "metrics/${TIMESTAMP}_metrics.json" \
                  "models/model_${TIMESTAMP}.joblib" \
                  "models/model_${TIMESTAMP}_calibrated.joblib"
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Lab 2: add model version ${TIMESTAMP} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
